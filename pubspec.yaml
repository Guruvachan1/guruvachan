name: cmum
description: "GURU DARSHAN - Events & Media Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  # Supabase
  supabase_flutter: ^2.17.2

  # State Management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # UI Components
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  photo_view: ^0.15.0
  carousel_slider: ^5.0.0
  url_launcher: ^6.3.1
  skeletonizer: ^2.1.3

  # YouTube Player
  youtube_player_iframe: ^5.2.0

  # Formatting
  intl: ^0.19.0

  # Icons
  cupertino_icons: ^1.0.8

  # Image Upload
  image_picker: ^1.1.2
  http: ^1.2.2
  youtube_player_flutter: ^9.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/

